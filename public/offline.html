<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <link rel="icon" href="./nomio-icon.svg" type="image/svg+xml" />
    <title>nomio · offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101820;
        color: #f4ead7;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      img {
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: #b6c4c7;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./nomio-icon.svg" alt="" />
      <h1>your island is sleeping</h1>
      <p>Reconnect to return to nomio. Your locally saved worlds will be waiting.</p>
    </main>
  </body>
</html>
